<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Аффирмация — Positive affirmations</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header class="hero">
      <h1>✨ Аффирмация ✨</h1>
      <p class="subtitle">Создай свои персональные аффирмации с помощью AI</p>
    </header>

    <main>
      <section class="intro">
        <p>Аффирмации — это короткие позитивные утверждения, которые при регулярном повторении помогают изменить мышление и привлечь желаемое в жизнь.</p>
      </section>

      <section class="form-section">
        <div class="step">
          <h2>Выберите пол</h2>
          <div class="gender-buttons">
            <button class="gender-btn" data-gender="male">
              <span class="icon">♂</span>
              Мужчина
            </button>
            <button class="gender-btn" data-gender="female">
              <span class="icon">♀</span>
              Женщина
            </button>
          </div>
        </div>

        <div class="step">
          <h2>Выберите тему</h2>
          <div class="theme-grid">
            <button class="theme-btn" data-theme="самооценка">💖 Самооценка</button>
            <button class="theme-btn" data-theme="уверенность">💪 Уверенность</button>
            <button class="theme-btn" data-theme="любовь">❤️ Любовь к себе</button>
            <button class="theme-btn" data-theme="успех">🌟 Успех</button>
            <button class="theme-btn" data-theme="здоровье">🏥 Здоровье</button>
            <button class="theme-btn" data-theme="финансы">💰 Финансы</button>
            <button class="theme-btn" data-theme="отношения">🤝 Отношения</button>
            <button class="theme-btn custom-theme-btn" data-theme="custom">✏️ Своя тема</button>
          </div>
          <div class="custom-input hidden">
            <input type="text" id="customTheme" placeholder="Введите свою тему..." maxlength="50">
          </div>
        </div>

        <button class="generate-btn" disabled>
          <span class="btn-text">Сгенерировать аффирмации</span>
          <span class="btn-loader hidden">Генерация...</span>
        </button>
      </section>

      <section class="result hidden">
        <h2>🌸 Ваши аффирмации</h2>
        <ul class="affirmations-list" id="affirmationsList"></ul>
        <button class="regenerate-btn">Сгенерировать новые</button>
      </section>
    </main>

    <footer>
      <p>Сделано с любовью 💕</p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
